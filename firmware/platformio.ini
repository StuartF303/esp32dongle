; usbdongle W1 — command console over USB CDC, on top of the W0 platform
; bring-up skeleton for the LilyGO T-Dongle-S3.
; See ../ARCHITECTURE.md and ../CLAUDE.md for the verified hardware facts and design.
;
; SAFETY: `pio run -t upload` REPARTITIONS the device and destroys the factory demo
; that is currently flashed. See README.md before uploading.

[platformio]
; TinyUSB is the primary build (decided 2026-08-16). The `hid` and `msc` modules
; need composite CDC+HID+MSC, which the fixed-function USB-Serial/JTAG peripheral
; cannot provide. `t-dongle-s3` is kept as the MODE=1 fallback — it is the only way
; to get USB-JTAG, and it has a slightly faster, script-free upload path.
; See ARCHITECTURE.md "USB mode" for the measured trade-off.
default_envs = t-dongle-s3-tinyusb

[env:t-dongle-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; pioarduino fork, pinned to release 55.03.311 (Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5).
; NOT the official espressif32 platform, which is stuck on Arduino-ESP32 2.0.17.
framework = arduino

; boards/lilygo-t-dongle-s3.json is auto-discovered next to this file — no
; boards_dir needed. That key is [platformio]-section-only and is silently
; ignored per-env, printing a build warning every time; do not re-add it.
board = lilygo-t-dongle-s3

board_build.partitions = partitions.csv
; Custom 16 MB dual-OTA layout — see ARCHITECTURE.md section 3.
; No board_build.filesystem override yet: LittleFS is mounted by app code in a later
; work item (W0 platform work continues after this skeleton), not by the build system.

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Native USB-Serial/JTAG: Serial goes over the native USB peripheral, not a UART bridge.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_NO_PSRAM

monitor_speed = 115200
upload_speed = 460800

; --no-stub is REQUIRED on this board, not an optimisation. esptool's stub flasher
; dies with "Packet content transfer stopped" reproducibly at specific offsets
; (0x4e000 is one) — retrying and chunking do not help. The ROM loader is ~3x slower
; but completely reliable. See ../CLAUDE.md "Serial port access".
; Baud is irrelevant over native USB-Serial/JTAG, so the ROM loader costs little here.
upload_flags = --no-stub

; Pinned, not floating — see ../CLAUDE.md tooling notes on why this project
; pins explicit releases rather than tracking branches/latest.
;
; ---------------------------------------------------------------------------
; WHY Adafruit_ST7735 + Adafruit_GFX FOR THE `display` MODULE, over TFT_eSPI
; and LovyanGFX (all three were viable; decided 2026-08-17):
;
;   * NO FRAMEBUFFER, and none available to accidentally turn on. 160x80x16bpp
;     is 25,600 bytes and this chip has no PSRAM. Adafruit_SPITFT draws
;     straight to the panel; its per-instance RAM is the GFX object itself,
;     ~200 bytes total. LovyanGFX and TFT_eSPI both offer sprites, i.e. a
;     framebuffer one call away from being allocated by a future edit.
;   * IT ALREADY HAS THIS EXACT PANEL. INITR_MINI160x80_PLUGIN carries
;     _colstart 26 / _rowstart 1, INVON and the BGR MADCTL branch — which is,
;     independently derived, precisely LilyGO's factory_screen configuration
;     (set_gap(1,26) + swap_xy + mirror(false,true) + invert_color(true) +
;     LCD_RGB_ELEMENT_ORDER_BGR). No open-coded init sequence to maintain, and
;     no offsets guessed from a datasheet. See the block comment at the top of
;     src/mod_display.cpp.
;   * CONFIGURED IN C++, NOT IN A LIBRARY HEADER. TFT_eSPI's User_Setup.h is
;     the classic trap: the pin map and driver selection live INSIDE the
;     library, so a clean checkout or a lib update silently reverts them.
;     Driving it purely from -D flags is possible but means ~15 more build
;     flags per env. Adafruit takes its pins as constructor arguments, so the
;     configuration sits in the module that owns it.
;   * IT CAN GIVE THE BUS BACK. The module constructs the panel on the global
;     SPIClass (FSPI == SPI2_HOST on the S3), so display's disable() can call
;     SPI.end() and genuinely release the peripheral it claimed. TFT_eSPI has
;     no deinit path at all.
;
; Cost: Adafruit_GFX pulls in Adafruit_BusIO (and therefore Wire) for its I2C
; variants, which this build never instantiates — flash only, no RAM.
;
; KNOWN, COSMETIC, AND NOT SILENCEABLE FROM HERE. Adafruit_ST7735's
; library.properties declares `depends=Adafruit GFX Library, Adafruit seesaw
; Library, SD` — those last two are dependencies of its EXAMPLES, and
; PlatformIO installs a package's `depends` whether or not the build uses them.
; "SD" is an ambiguous registry name (arduino-libraries/SD and adafruit/SD), so
; a FRESH `.pio/libdeps` install prints:
;
;   Library Manager: Warning! More than one package has been found by SD
;   requirements: ... Please specify detailed REQUIREMENTS using package owner
;
; It resolves deterministically to arduino-libraries/SD@1.3.0 and is printed
; once, at install; subsequent builds are silent. Adding an owner-qualified
; `arduino-libraries/SD@1.3.0` here was TRIED and is worse: the warning still
; prints (it comes from resolving ST7735's own depends, before project
; lib_deps are consulted) and SD then appears in the Dependency Graph as a
; direct dependency, which it is not.
;
; Neither example-only package reaches the build. The LDF is in `chain` mode
; and nothing in src/ includes SD.h or seesaw.h — confirm against the
; Dependency Graph `pio run` prints, which lists ArduinoJson, ST7735, GFX,
; BusIO, SPI and the framework libraries. The residual cost is two unpinned
; packages sitting unused in .pio/libdeps; vendoring the ~700-line ST7735
; driver into lib/ is the only way to be rid of them, and that is stuart's call
; rather than a thing to do quietly.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

; Guards board_build.partitions against boards/lilygo-t-dongle-s3.json going
; stale — see scripts/check_boot_app0.py for what it checks and why.
extra_scripts = pre:scripts/check_boot_app0.py

; SAFETY. test/ holds host tests only (see [env:native]). Without this, a bare
; `pio test` would build them for the device and UPLOAD — i.e. repartition the
; dongle — as a side effect of running unit tests. Tests on this env are opt-in
; and there are none.
test_ignore = *

; No `board_build.arduino.memory_type` (PSRAM) setting: this board has none fitted,
; and the generic esp32s3 Arduino variant does not enable PSRAM support unless asked.

; ---------------------------------------------------------------------------
; PRIMARY BUILD. TinyUSB — composite CDC+HID+MSC. Adopted 2026-08-16.
;
; ARDUINO_USB_MODE=0 swaps Serial from HWCDC (fixed-function USB-Serial/JTAG) to
; USBCDC (TinyUSB over the OTG controller). The two peripherals share one PHY and
; are mutually exclusive — a compile-time choice, not a runtime one:
; `ARDUINO_USB_MODE` is a preprocessor #if selecting the Serial class
; (HardwareSerial.h:442). There is no boot-time switch.
;
; Why: `hid` and `msc` need composite CDC+HID+MSC. TinyUSB provides all three at
; once, so the debug console survives. It also lets us set real USB descriptors.
;
; Measured cost vs MODE=1 (2026-08-16, this board):
;   static RAM  23040 -> 55208 B   (+32 KB)
;   flash      322486 -> 376582 B  (+54 KB)
;   free heap  345592 -> 308336 B  (-37 KB)   <-- watch this once Wi-Fi/BLE land
;   deploy       10.0 -> 12.2 s    (+2.2 s, still fully automated)
;
; What it costs outright: USB-JTAG, permanently. Not a real loss here — GPIO39/40
; are the APA102 and 41/42 are not broken out, so an external JTAG probe was never
; possible on this board. Post-mortem debugging relies on the coredump partition.
; ---------------------------------------------------------------------------
[env:t-dongle-s3-tinyusb]
extends = env:t-dongle-s3
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_NO_PSRAM
; touch_reset.py is REQUIRED here, not a convenience: without the 1200-baud touch
; esptool cannot reset this build into download mode and every upload fails with
; "No serial data received". Measured 3/3 fail without, 3/3 clean with.
extra_scripts =
    pre:scripts/check_boot_app0.py
    pre:scripts/touch_reset.py

; ---------------------------------------------------------------------------
; HOST TEST ENV. `pio test -e native` — no hardware, no flashing, no serial port.
;
; claims.h and claims_selftest.h are dependency-free (only <stdint.h>) so that
; the arbitration rule can be compiled and asserted on this machine. That
; property was advertised in a comment and protected by nothing: any edit
; adding an Arduino.h include would have broken it silently, because nothing
; ever built those headers for the host. This env is what makes the claim true.
;
; NOT in default_envs: `pio run` still builds firmware only. src/ is excluded
; from this env entirely (build_src_filter) — the tests include the two headers
; directly and must not drag in Arduino.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I "${platformio.src_dir}"
